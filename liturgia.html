<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Folheto Litúrgico do Dia</title>
    <!-- Apenas CSS puro, sem Tailwind CDN -->
    <style>
        :root {
            --hero-scale: 6;
            --mary-size: min(clamp(240px, 80vh, 120dvw), 100dvh);
            --logo-real-multiplier: 6;
            --heart-x: 49%;
            --heart-y: 58%;
            --heart-ratio: 0.20;


            --logo-visible: calc(var(--mary-size) * var(--heart-ratio));
            --logo-real: calc(var(--logo-visible) * var(--logo-real-multiplier));

            --bg: #d7eaf8;
            --accent: #b3001b;
            --text: #050505;
            --tertiary-gold: #e1be6c;
            --primary-blue: #243d69;
        }

        [hidden] {
            display: none !important;
        }

        * {
            box-sizing: border-box;
        }

        h1,
        h2,
        h3,
        h4,
        h5,
        h6,
        p {
            margin: 0;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        button {
            border: none;
            background: none;
        }

        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');

        /* === Variáveis de Cor Litúrgica (CSS Padrão) === */
        .liturgical-container {
            --color-text: #1f2937;
            --color-primary-bg: #f8f8f8;
            --color-secondary: #3b82f6;
            /* Azul Padrão */
        }

        /* Mapeamento de Cores Litúrgicas para Variáveis CSS */
        .cor-Branco {
            --color-secondary: #d4a73e;
            /* Dourado */
        }

        .cor-Vermelho {
            --color-secondary: #dc2626;
            /* Vermelho */
        }

        .cor-Verde {
            --color-secondary: #10b981;
            /* Verde esmeralda */
        }

        .cor-Roxo {
            --color-secondary: #7c3aed;
            /* Roxo profundo */
        }

        .cor-Rosa {
            --color-secondary: #ec4899;
            /* Rosa */
        }

        .cor-Preto {
            --color-secondary: #1f2937;
            /* Preto/Cinza */
        }

        /* === Estilos Globais e Reset === */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f7f7;
            transition: all 0.5s ease-in-out;
            margin: 0;
            padding: 0;
        }

        header {
            z-index: 999;

            position: fixed;
            left: 0;
            right: 0;

            display: flex;
            align-items: center;

            padding: 10px;
            padding-left: 0;
            padding-right: 20px;

            background: rgb(255, 255, 255, 0.5);
            border-radius: 0 0 20px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: inset 0 0 20px 10px rgb(36, 67, 105, 0.7);

            overflow: hidden;
        }

        .header-group {
            display: flex;
            align-items: center;
        }

        header img {
            width: 70px;
        }

        #parish-name-wrapper {
            color: var(--primary-blue);

            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        #parish-name-wrapper h1 {
            font-size: 14px;
        }

        #parish-name-wrapper p {
            font-size: 10px;
        }

        #menu-btn {
            font-family: 'Cinzel', sans-serif;
            background: var(--tertiary-gold);
            color: var(--primary-blue);
            height: fit-content;
            padding: 10px 20px;
            border-radius: 50px;
            border: none;
            margin-left: auto;
        }

        .navigation {
            margin-left: auto;
        }

        .navigation ul {
            display: flex;
            gap: 1.5rem;
        }

        .navigation a {
            font-size: 1.125rem;
            font-weight: 500;
            border-bottom: 2px solid transparent;
        }

        .navigation a:hover {
            color: var(--tertiary-gold);
        }

        .navigation .active {
            color: var(--tertiary-gold);
            border-bottom-color: var(--tertiary-gold);
        }

        /* === Loading SVG Animation (NOVO ESTILO) === */
        #loader-overlay {
            z-index: 50;
            position: fixed;
            inset: 0;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            background-color: rgba(249, 250, 251, 0.75);
        }

        #loader-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* NOVOS ESTILOS PARA O DESENHO DO CAMINHO SVG */
        #first-path {
            fill: none;
            stroke: #243d69;
            stroke-width: 4;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 1200;
            stroke-dashoffset: 1200;

            animation: draw 1.8s ease-in-out infinite;
        }

        #second-path {
            fill: none;
            stroke: #133061;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 1200;
            stroke-dashoffset: 1200;

            transform-origin: center;
            transform: scale(0.95);

            animation: draw 1.8s ease-in-out infinite;
        }

        @keyframes draw {
            0% {
                stroke-dashoffset: 1200;
                opacity: 0.2;
            }

            50% {
                opacity: 1;
            }

            100% {
                stroke-dashoffset: 0;
                opacity: 0.2;
            }
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
                opacity: 0.85;
            }

            50% {
                transform: scale(1.04);
                opacity: 1;
            }
        }

        .pulse-animation {
            animation: pulse 1.6s ease-in-out infinite;
        }

        #loading-text {
            font-family: 'Inter', sans-serif;
            font-size: 24px;
            color: #243d69;
            margin: 0;
            text-align: center;

            position: absolute;
        }

        /* === App Container === */
        #app {
            max-width: 960px;
            /* max-w-4xl */
            margin: 0 auto;
            padding: 1rem;
            padding-top: 100px;
            /* p-4 */
            display: flex;
            flex-direction: column;
            gap: 2rem;
            /* space-y-8 */
        }

        /* === Cabeçalho Principal === */
        #liturgia-header {
            background-color: var(--color-secondary);
            /* header-bg */
            padding: 1.5rem;
            /* p-6 */
            border-radius: 0.75rem;
            /* rounded-xl */
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            /* shadow-lg */
            color: white;
            /* text-white */
            text-align: center;
            /* text-center */
            transition: background-color 0.5s ease;
        }

        #data-liturgia {
            font-size: 0.875rem;
            /* text-sm */
            font-weight: 500;
            /* font-medium */
            opacity: 0.9;
        }

        #titulo-liturgia {
            font-size: 2rem;
            /* text-3xl */
            font-weight: 800;
            /* font-extrabold */
            margin-top: 0.25rem;
            /* mt-1 */
            letter-spacing: -0.025em;
            /* tracking-tight */
        }

        #cor-liturgica {
            margin-top: 0.5rem;
            /* mt-2 */
            font-size: 1rem;
            /* text-base */
            font-style: italic;
            font-weight: 300;
            /* font-light */
            opacity: 0.9;
        }

        @media (min-width: 768px) {
            #liturgia-header {
                padding: 2rem;
                /* md:p-8 */
            }

            #titulo-liturgia {
                font-size: 3rem;
                /* md:text-5xl */
            }

            #data-liturgia,
            #cor-liturgica {
                font-size: 1.125rem;
                /* md:text-base/lg */
            }
        }

        /* === Conteúdo do Folheto - Blocos === */
        #liturgia-content {
            display: flex;
            flex-direction: column;
            gap: 3rem;
            /* space-y-12 */
        }

        .card {
            background-color: var(--color-primary-bg);
            /* bg-card */
            padding: 1.5rem;
            /* p-6 */
            border-radius: 0.75rem;
            /* rounded-xl */
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            /* shadow-md */
            transition: all 0.3s ease;
        }

        .card:hover {
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            /* hover:shadow-xl */
        }

        .section-title {
            position: relative;
            padding-bottom: 0.5rem;
            margin-bottom: 1rem;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--color-text);
        }

        .section-title::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: 0;
            width: 50px;
            height: 3px;
            background-color: var(--color-secondary);
            border-radius: 9999px;
        }

        .text-primary-color {
            color: var(--color-secondary);
        }

        /* Estilos para textos dentro dos blocos de conteúdo */
        .content-text p {
            margin-bottom: 1rem;
            /* mb-4 */
            line-height: 1.625;
            /* leading-relaxed */
            color: #4b5563;
            /* text-gray-700 */
            font-size: 0.875rem;
            /* text-sm */
        }

        @media (min-width: 768px) {
            .content-text p {
                font-size: 1rem;
                /* md:text-base */
            }
        }

        /* Estilos Específicos */
        .missa-parte-title {
            font-size: 1.875rem;
            /* text-3xl */
            font-weight: 800;
            /* font-extrabold */
            text-align: center;
            margin: 2rem 0;
            /* my-8 */
            padding: 1rem;
            /* p-4 */
            background-color: rgba(var(--color-secondary-rgb, 59, 130, 246), 0.2);
            /* bg-primary/20 */
            border-radius: 0.5rem;
            /* rounded-lg */
            box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.06);
            /* shadow-inner */
            color: var(--color-secondary);
        }

        .leitura-block {
            border-left: 4px solid var(--color-secondary);
            margin-bottom: 1.5rem;
            /* mb-6 */
        }

        .salmo-block {
            background-color: rgba(var(--color-secondary-rgb, 59, 130, 246), 0.05);
            /* bg-opacity-50 */
            border: 2px solid rgba(var(--color-secondary-rgb, 59, 130, 246), 0.2);
            /* border-primary/20 */
        }

        .salmo-block .refrao {
            font-weight: 800;
            color: var(--color-secondary);
            font-size: 1.25rem;
            text-align: center;
            padding: 0.5rem;
            margin-bottom: 0.75rem;
            border-bottom: 2px solid rgba(var(--color-secondary-rgb, 59, 130, 246), 0.3);
        }

        .salmo-block .content-text p {
            font-style: italic;
        }

        .oracao-coleta-block {
            border-left: 4px solid var(--color-secondary);
            background-color: rgba(var(--color-secondary-rgb, 59, 130, 246), 0.1);
        }

        /* Estilo para Evangelho */
        .evangelho-block {
            background-color: rgba(16, 185, 129, 0.1);
            /* bg-green-50/50 */
            border-left: 4px solid #10b981;
            /* border-green-600 */
        }

        /* Estilo para Nota da Vigília */
        .vigilia-note {
            background-color: rgba(254, 252, 232, 0.5);
            font-style: italic;
            border: 1px dashed #f59e0b;
            padding: 1rem;
            border-radius: 0.5rem;
        }

        /* === Rodapé === */
        footer {
            text-align: center;
            color: #6b7280;
            /* text-gray-500 */
            font-size: 0.875rem;
            /* text-sm */
            padding-top: 2rem;
            /* pt-8 */
            padding-bottom: 1rem;
            /* pb-4 */
            border-top: 1px solid #d1d5db;
            /* border-t border-gray-300 */
        }
    </style>
</head>

    <script>
        // === JavaScript (Vanilla) ===
        const API_URL = "https://liturgia.up.railway.app/v2/";

        /**
         * Realiza a chamada fetch para a API da Liturgia do Dia.
         * Implementa retentativa com backoff exponencial.
         * @param {number} retries - Número de retentativas.
         * @returns {Promise<Object>} Dados da liturgia.
         */
        async function fetchLiturgia(retries = 3) {
            for (let i = 0; i < retries; i++) {
                try {
                    const response = await fetch(API_URL);
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return await response.json();
                } catch (error) {
                    if (i === retries - 1) {
                        throw new Error("Não foi possível carregar a liturgia do dia. Por favor, tente novamente mais tarde.");
                    }
                    // Espera exponencial antes de tentar novamente (1s, 2s, 4s...)
                    const delay = Math.pow(2, i) * 1000;
                    await new Promise(resolve => setTimeout(resolve, delay));
                }
            }
        }

        /**
         * Cria um bloco de conteúdo genérico (título e texto)
         * @param {string} title - Título da seção.
         * @param {string} content - Conteúdo em texto puro.
         * @param {string} [extraClass=''] - Classes adicionais para o card.
         * @returns {string} HTML do bloco.
         */
        function createContentBlock(title, content, extraClass = '') {
            if (!content) return '';

            // Substitui quebras de linha por parágrafos no HTML
            const paragraphs = content.split('\n').map(p =>
                `<p class="mb-4 leading-relaxed text-gray-700">${p.trim()}</p>`
            ).join('');

            return `
                <div class="card ${extraClass}">
                    <h2 class="section-title">${title}</h2>
                    <div class="content-text">${paragraphs}</div>
                </div>
            `;
        }

        /**
         * Cria um bloco de leitura bíblica (título, referência, texto)
         * @param {Object} leitura - Objeto da leitura.
         * @param {string} [extraClass=''] - Classes adicionais para o card.
         * @returns {string} HTML do bloco.
         */
        function createLeituraBlock(leitura, extraClass = '') {
            if (!leitura || !leitura.texto) return '';

            const singleLeitura = Array.isArray(leitura) ? leitura[0] : leitura;
            if (!singleLeitura) return '';

            const paragraphs = singleLeitura.texto.split('\n').map(p =>
                `<p>${p.trim()}</p>`
            ).join('');

            return `
                <div class="card leitura-block ${extraClass}">
                    <p class="text-sm font-semibold text-primary-color" style="margin-bottom: 0.25rem;">${singleLeitura.referencia}</p>
                    <h3 style="font-weight: 800; font-size: 1.25rem; color: #1f2937; margin-bottom: 1rem;">${singleLeitura.titulo}</h3>
                    <div class="content-text">${paragraphs}</div>
                </div>
            `;
        }

        /**
         * Cria um bloco de Salmo Responsorial (referência, refrão, texto)
         * @param {Object} salmo - Objeto do salmo (pode ser um array, pega o primeiro).
         * @returns {string} HTML do bloco.
         */
        function createSalmoBlock(salmo) {
            const singleSalmo = Array.isArray(salmo) ? salmo[0] : salmo;
            if (!singleSalmo || !singleSalmo.texto) return '';

            const paragraphs = singleSalmo.texto.split('\n').map(p =>
                `<p>${p.trim()}</p>`
            ).join('');

            return `
                <div class="card salmo-block">
                    <p style="font-size: 0.875rem; color: #6b7280; margin-bottom: 0.25rem;">${singleSalmo.referencia}</p>
                    <p class="refrao">R. ${singleSalmo.refrao || 'Aleluia!'}</p>
                    <div class="content-text">${paragraphs}</div>
                </div>
            `;
        }

        /**
         * Obtém a cor litúrgica mapeada para a classe CSS.
         * Também calcula o RGB para usar em opacidades CSS.
         * @param {string} cor - Nome da cor em português (e.g., "Branco").
         * @returns {string} Classe CSS.
         */
        function getColorClass(cor) {
            const map = {
                "Branco": { class: "cor-Branco", rgb: "212, 167, 62" },
                "Verde": { class: "cor-Verde", rgb: "16, 185, 129" },
                "Roxo": { class: "cor-Roxo", rgb: "124, 58, 237" },
                "Vermelho": { class: "cor-Vermelho", rgb: "220, 38, 38" },
                "Rosa": { class: "cor-Rosa", rgb: "236, 72, 153" },
                "Preto": { class: "cor-Preto", rgb: "31, 41, 55" }
            };
            const defaultColor = { class: 'cor-Branco', rgb: "212, 167, 62" };
            const result = map[cor] || defaultColor;

            // Define a variável RGB para ser usada nas opacidades (ex: bg-primary/20)
            document.documentElement.style.setProperty('--color-secondary-rgb', result.rgb);

            return result.class;
        }

        /**
         * Renderiza a estrutura completa do folheto litúrgico.
         * @param {Object} data - O objeto de dados da liturgia.
         */
        function renderLiturgia(data) {
            const contentDiv = document.getElementById('liturgia-content');

            // 1. Configurar cores e atualizar o Cabeçalho
            const body = document.querySelector('body');
            body.classList.add(getColorClass(data.cor));

            document.getElementById('data-liturgia').textContent = data.data;
            document.getElementById('titulo-liturgia').textContent = data.liturgia;
            document.getElementById('cor-liturgica').textContent = `Cor Litúrgica: ${data.cor}`;

            let html = '';

            const oracoesExtrasMap = data.oracoes.extras ? data.oracoes.extras.reduce((acc, current) => {
                acc[current.titulo] = current.texto;
                acc[current.tipo] = current.texto;
                return acc;
            }, {}) : {};

            function createStandardMissaBlock(title, note, typeClass = '') {
                return createContentBlock(title, note, typeClass);
            }

            // ------------------------------------------------------------------
            // A. RITOS INICIAIS
            // ------------------------------------------------------------------
            html += `<h2 class="missa-parte-title">A. RITOS INICIAIS</h2>`;

            // Canto de Entrada (Antífona de Entrada)
            html += createContentBlock('Canto de Entrada', data.antifonas.entrada || 'O canto é escolhido de acordo com o tempo litúrgico.', 'bg-gray-100');

            html += createStandardMissaBlock('Saudação', 'O presidente saúda a assembleia com o sinal da cruz e a saudação litúrgica apropriada.');

            html += createStandardMissaBlock('Ato Penitencial', 'O presidente convida a assembleia ao arrependimento dos pecados. (Ex: "Confesso a Deus..." ou fórmula breve)');

            // Glória (Hino de Louvor)
            if (data.leituras.extras && data.leituras.extras.some(e => e.titulo === "Hino de Louvor (Glória)")) {
                html += createContentBlock('Hino de Louvor (Glória)',
                    'Inicia-se o canto do Glória (Hino de Louvor), conforme o rito específico.',
                    'bg-yellow-200 text-yellow-900 border-l-4 border-yellow-800 font-bold');
            } else {
                html += createStandardMissaBlock('Hino de Louvor (Glória)', 'Cantado ou recitado, exceto nos tempos do Advento e Quaresma.');
            }

            // Oração da Coleta
            html += createContentBlock('Oração da Coleta', data.oracoes.coleta, 'oracao-coleta-block');

            // ------------------------------------------------------------------
            // B. LITURGIA DA PALAVRA
            // ------------------------------------------------------------------
            html += `<h2 class="missa-parte-title">B. LITURGIA DA PALAVRA</h2>`;

            // 1ª Leitura
            if (data.leituras.primeiraLeitura && data.leituras.primeiraLeitura.length > 0) {
                if (data.leituras.primeiraLeitura.length > 1 && data.leituras.liturgia && data.leituras.liturgia.includes("Vigília")) {
                    html += createContentBlock('Nota: Sete Leituras',
                        'Por ser a Vigília Pascal, a Liturgia da Palavra é estendida, contendo as sete leituras do Antigo Testamento, seguidas da Epístola e do Evangelho. (O folheto exibe apenas a Primeira Leitura e o Salmo correspondente para brevidade, mas todas as leituras estão disponíveis no JSON de retorno da API).',
                        'vigilia-note'
                    );
                }
                html += `<h3 style="font-size: 1.5rem; font-weight: 700; color: #1f2937; margin-top: 2rem; margin-bottom: 1rem;">PRIMEIRA LEITURA</h3>`;
                html += createLeituraBlock(data.leituras.primeiraLeitura[0]);
                html += createSalmoBlock(data.leituras.salmo[0] || data.leituras.salmo);
            }

            // 2ª Leitura (Epístola no rito comum)
            if (data.leituras.segundaLeitura && data.leituras.segundaLeitura.length > 0) {
                html += `<h3 style="font-size: 1.5rem; font-weight: 700; color: #1f2937; margin-top: 2rem; margin-bottom: 1rem;">SEGUNDA LEITURA (EPÍSTOLA)</h3>`;
                html += createLeituraBlock(data.leituras.segundaLeitura[0]);
            } else if (oracoesExtrasMap["Epístola"]) {
                html += `<h3 style="font-size: 1.5rem; font-weight: 700; color: #1f2937; margin-top: 2rem; margin-bottom: 1rem;">EPÍSTOLA</h3>`;
                html += createContentBlock(data.leituras.extras.find(e => e.tipo === "Epístola").titulo, oracoesExtrasMap["Epístola"]);
            }

            // Aclamação ao Evangelho
            html += `<h3 style="font-size: 1.5rem; font-weight: 700; color: #1f2937; margin-top: 2rem; margin-bottom: 1rem;">ACLAMAÇÃO AO EVANGELHO</h3>`;
            const aleluiaSalmo = data.leituras.salmo.find(s => s.refrao && (s.refrao.toLowerCase().includes('aleluia') || s.refrao.toLowerCase().includes('aleluia')));
            html += createSalmoBlock(aleluiaSalmo || data.leituras.salmo[data.leituras.salmo.length - 1] || { referencia: 'Aclamação', refrao: 'Aleluia', texto: 'Aclamação de louvor a Cristo.' });


            // Evangelho
            if (data.leituras.evangelho && data.leituras.evangelho.length > 0) {
                html += `<h3 style="font-size: 1.5rem; font-weight: 700; color: #1f2937; margin-top: 2rem; margin-bottom: 1rem;">EVANGELHO</h3>`;
                html += createLeituraBlock(data.leituras.evangelho[0], 'evangelho-block');
            }

            html += createStandardMissaBlock('Homilia', 'Momento de meditação e pregação sobre as leituras proclamadas.');

            // Profissão de Fé (Creio) e Oração da Assembleia
            html += createStandardMissaBlock('Profissão de Fé (Creio)', 'Recitado ou cantado, exceto quando substituído pela Renovação das Promessas Batismais (Vigília Pascal).');
            html += createStandardMissaBlock('Oração da Assembleia (Preces)', 'Orações dos Fiéis, com as intenções da comunidade e da Igreja.');


            // ------------------------------------------------------------------
            // C. LITURGIA EUCARÍSTICA
            // ------------------------------------------------------------------
            html += `<h2 class="missa-parte-title">C. LITURGIA EUCARÍSTICA</h2>`;

            html += createStandardMissaBlock('Canto das Oferendas (Canto de Preparação)',
                'Apresentação das Oferendas e preparação do altar.');

            // Oração sobre as Oferendas
            html += createContentBlock('Oração sobre as Oferendas', data.oracoes.oferendas, 'oracao-coleta-block');

            html += createStandardMissaBlock('Oração Eucarística', 'Diálogo do prefácio, Santo, Consagração e Doxologia. (Excerto: "O Corpo de Cristo. R. Amém.")');

            html += createStandardMissaBlock('Rito da Paz', 'Paz de Cristo. R. Amém. Saúdem-se com um sinal de paz.');

            // Comunhão
            html += `<h3 style="font-size: 1.5rem; font-weight: 700; color: #1f2937; margin-top: 2rem; margin-bottom: 1rem;">COMUNHÃO</h3>`;
            html += createContentBlock('Antífona de Comunhão', data.antifonas.comunhao);

            // Oração após a Comunhão
            html += createContentBlock('Oração após a Comunhão', data.oracoes.comunhao, 'oracao-coleta-block');


            // ------------------------------------------------------------------
            // D. RITOS FINAIS
            // ------------------------------------------------------------------
            html += `<h2 class="missa-parte-title">D. RITOS FINAIS</h2>`;
            html += createStandardMissaBlock('Avisos e Bênção Final',
                'O sacerdote abençoa o povo. Vai em paz e que o Senhor te acompanhe. R. Graças a Deus.');
            html += createStandardMissaBlock('Canto Final', 'Canto de envio e despedida.');

            contentDiv.innerHTML = html;
        }

        // Função principal para inicializar
        window.onload = async function () {
            const loaderOverlay = document.querySelector('#loader-overlay');
            const loaderContainer = document.querySelector('#loader-container');
            const app = document.querySelector('#app');

            try {
                const data = await fetchLiturgia();
                renderLiturgia(data);

                // Exibir o conteúdo e esconder o loaderOverlay
                loaderOverlay.hidden = true;
                app.style.display = 'flex'; // Exibir como flex column (definido no CSS)

            } catch (error) {
                // Em caso de erro, exibe a mensagem de erro no loaderContainer e no console
                console.error("Erro fatal na inicialização:", error);
                loaderContainer.style.display = 'flex';
                loaderContainer.style.backgroundColor = 'rgba(254, 242, 242, 0.75)'; /* Fundo vermelho claro */
                loaderContainer.classList.remove('pulse-animation');

                const errorMessage = (error instanceof SyntaxError)
                    ? `Erro ao processar dados da liturgia. Formato da API inesperado. <br><br>Detalhe: ${error.message}`
                    : error.message;

                loaderContainer.innerHTML = `
                    <div style="text-align: center; color: #b91c1c; font-weight: 700; padding: 1rem; background-color: white; border-radius: 0.5rem; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); max-width: 80%; line-height: 1.5;">
                        ${errorMessage}
                    </div>
                `;
            }
        };
    </script>
</body>

</html>
